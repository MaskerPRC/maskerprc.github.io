<head><meta charset="UTF-8"></head><body><p>SciML，即科学机器学习，涵盖了将定量科学和机器学习相结合的工作。在过去十年中，它获得了显著的关注，这得益于专用硬件（如 GPU 和 TPU）和数据集的广泛应用。此外，它还受到机器学习浪潮的总体影响，这种影响已经深深植根于我们时代的时代精神中。在此背景下，我们想介绍 SimulAI，这是一个 Apache 2.0 许可下的开源工具包。SimulAI 旨在易于使用，为科学机器学习管道提供高级 Python 接口。本文旨在展示其当前的流程和构建科学实验的实用性。我们鼓励有兴趣的社区提供反馈和潜在贡献，并计划在未来文章中深入探讨更高级的主题。</p>
