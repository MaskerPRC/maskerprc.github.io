<head><meta charset="UTF-8"></head><body><p>在药物发现中，理解蛋白质的 3D 结构是评估药物与其结合能力的关键，这直接影响其疗效。然而，预测 3D 蛋白质形态却非常复杂、具有挑战性、昂贵且耗时，使用传统的 X 射线衍射等方法可能需要数年。将机器学习（ML）应用于预测这些结构可以显著缩短预测蛋白质结构所需的时间——从数年缩短到数小时。几个知名研究团队发布了 AlphaFold2（AF2）、RoseTTAFold 等算法。这些算法被《科学》杂志评为 2021 年年度突破。</p>
