<head><meta charset="UTF-8"></head><body><p>艾克斯安，公共安全领域的科技领导者，开发了人工智能技术，将其应用于车载摄像头产品，增加了尖端的车牌识别功能，现在可以识别感兴趣车辆的牌照，并为执法机构提供主动通知和警报。艾克斯安的 AI 科学家和工程师选择了微软 Azure 基础设施作为可扩展、成本效益高且功能丰富的环境，在那里他们可以开发和测试 AI 模型。借助 Azure 的计算、存储和 PyTorch 以及机器学习资源，艾克斯安可以轻松利用最新的软件和硬件技术，为其客户提供最优质的 AI 解决方案。</p>
