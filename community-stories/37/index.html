<!DOCTYPE html>

<head><meta charset="UTF-8"></head><body><p>软件创新者 Bentley Systems 为设计、建设和运营全球基础设施资产的组织提供了一系列解决方案。该公司在其旗舰产品中使用机器学习来读取不同的纸质资产数据，并将其转换为综合的数字数据。为了加快并规范化这一过程，Bentley 利用 Microsoft Azure Machine Learning 和 PyTorch 创建了一个机器学习操作框架。自从开始使用这个稳定、可复制的框架以来，开发者的速度和满意度大幅提升，他们可以将代码轻松地部署到云端，从而将交付速度提高三到五倍，并显著提高效率。</p>
