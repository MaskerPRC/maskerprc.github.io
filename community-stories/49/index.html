<head><meta charset="UTF-8"></head><body><p>每个人在与其他聊天机器人和其他自动化服务进行交流时，更喜欢使用母语。然而，对于像匈牙利语这样的语言——只有 1500 万人使用——市场规模通常被认为太小，大公司无法创建可以处理匈牙利语文本输入的软件、工具或应用程序。认识到这一需求，佩奇大学应用数据科学和人工智能团队决定采取行动。利用微软 AI 解决方案和 ONNX 运行时解决方案，它在不到 200 小时内以本土化的匈牙利语构建并训练了自己的 BERT-large 模型，总成本为 1000 欧元。</p>
