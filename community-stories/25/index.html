<head><meta charset="UTF-8"></head><body><p>进行手术在很大程度上是关于决策。正如弗兰克·斯宾塞博士在 1978 年所说：“一次熟练完成的手术大约有 75%是决策，25%是技巧”。五十年后，外科领域终于——尽管是逐渐地——开始实施数据科学和人工智能的进步，以增强外科医生在手术室做出最佳决策的能力。这就是 theator 发挥作用的地方：该公司正在通过一个利用高度先进的 AI、特别是机器学习和计算机视觉技术的手术智能平台重新构想手术，该平台分析手术的每一步、每个事件、每个里程碑和关键节点——显著提高外科医生的整体表现。</p>
