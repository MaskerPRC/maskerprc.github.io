<head><meta charset="UTF-8"></head><body><p>AI21 Labs 利用机器学习开发专注于理解意义的语言模型，并在 2021 年设定了训练最近发布的具有 1780 亿参数的自回归语言模型 Jurassic-1 Jumbo 的目标。注册进行 beta 测试的开发者将获得访问 Jurassic-1 Jumbo 的权限，并可以立即开始根据他们的用例定制模型。该软件初创公司希望高效地训练模型，因此转向了亚马逊网络服务（AWS），并使用亚马逊弹性计算云（Amazon EC2）构建了一个解决方案。选择 Amazon EC2 使公司能够控制训练过程，包括节点分配。</p>
