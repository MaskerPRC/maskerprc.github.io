<head><meta charset="UTF-8"></head><body><p>在这个网络研讨会中，英特尔公司的 Bob Chesebrough 向您介绍了他创建剪裁图像并去除背景杂乱的步骤。他使用 PyTorch 的单目深度估计技术实现了这一点。这可以潜在地用于自动化从运动结构和其他图像相关任务，其中您希望突出或关注图像的某个部分，尤其是识别离相机最近的图像部分。具体来说，他使用了几张他在自然历史博物馆拍摄的图片进行深度估计，仅捕捉前景中的恐龙，消除了背景壁画、灯光和建筑结构。这个算法的酷之处在于它可以从单张图像中创建深度估计！</p>
