<head><meta charset="UTF-8"></head><body><p>许多人们在 Facebook 和 Instagram 上享受的体验都是由人工智能（AI）驱动的。其中一些，如助手、头像和 AR 效果，由于延迟、网络带宽和其他限制，无法由服务器端 AI 提供支持。在设备上运行 AI——即在手机、平板电脑甚至一副智能眼镜上直接运行——与不断将数据发送回服务器相比，具有巨大优势。它更快，并为使用我们平台的人创造了一个增强隐私的体验。然而，设备上的 AI 带来了新的挑战，因为它需要应对电池小、处理能力远不如数据中心服务器的设备。</p>
