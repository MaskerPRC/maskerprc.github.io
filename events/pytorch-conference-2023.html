<head><meta charset="UTF-8"></head><body><p><strong>日期 </strong>：2023 年 10 月 16 日至 17 日</p>

<p>本次会议将展示 PyTorch 2.1，这是广受欢迎的机器学习框架的下一代版本。作为 Linux 基金会的成员，PyTorch 基金会会议继续秉承传统，汇集领先的学者、开发者和学术社区，以推进端到端机器学习的教育和开发。</p>

<p>会议日程安排了一系列引人入胜的活动，包括开幕式招待会、社区和合作伙伴讨论、信息丰富的讨论小组、海报展示、启发性的用例和社区故事，以及关于机器学习和深度学习开发与部署最新趋势的讨论。</p>
