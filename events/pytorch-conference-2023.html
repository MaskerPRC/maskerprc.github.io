<head><meta charset="UTF-8"></head><body><p>日期：2023 年 10 月 16 日 - 17 日</p>

<p>本次会议将展示 PyTorch 2.1，这是广受欢迎的机器学习框架的下一代版本。作为 Linux 基金会的一部分，PyTorch 基金会会议继续秉承传统，将领先的学者、开发者和学术社区聚集在一起，以推进端到端机器学习的教育和开发。</p>

<p>会议议程亮点纷呈，包括开幕式招待会、引人入胜的社区和合作伙伴讨论、信息丰富的专题讨论、海报展示、启发性案例研究和社区故事，以及关于机器学习和深度学习最新发展趋势及其开发与部署的讨论。</p>
